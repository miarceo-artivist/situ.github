<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja de Comentarios con Sheety</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; color: blue; }
        form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
        input, textarea, button { padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .comentario { background: #f9f9f9; padding: 15px; border-left: 5px solid #007bff; margin-bottom: 10px; border-radius: 4px; }
        .autor { font-weight: bold; margin-bottom: 5px; display: block; }
    </style>

    <script>
        // Tu URL base de Sheety
        const url = 'https://api.sheety.co/e747b19c10a06a356a61015e63a8ed11/prototype1/hoja1';

        // 1. FUNCIÓN PARA LEER Y MOSTRAR COMENTARIOS (GET)
        function cargarComentarios() {
            fetch(url)
            .then(response => response.json())
            .then(json => {
                const contenedor = document.getElementById('contenedor-comentarios');
                contenedor.innerHTML = ''; // Limpiar comentarios antiguos

                // Nota: Sheety suele devolver los datos en la propiedad con el nombre de la hoja (ej: json.hoja1)
                const comentarios = json.hoja1 || json.hoja1S || []; 
                
                comentarios.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'comentario';
                    // Reemplaza 'nombre' y 'comentario' por los nombres exactos de tus columnas en Google Sheets (en minúsculas)
                    div.innerHTML = `<span class="autor">${item.nombre || 'Anónimo'}:</span> 
                                     <p>${item.comentario || ''}</p>`;
                    contenedor.appendChild(div);
                });
            })
            .catch(error => console.error('Error al cargar:', error));
        }

        // 2. FUNCIÓN PARA ENVIAR UN NUEVO COMENTARIO (POST)
        function enviarComentario(event) {
            event.preventDefault(); // Evita que la página se recargue

            const nombreInput = document.getElementById('txtNombre').value;
            const comentarioInput = document.getElementById('txtComentario').value;

            // IMPORTANTE: Sheety requiere que el objeto raíz tenga el nombre de la hoja en SINGULAR ('hoja1')
            // Las propiedades internas deben coincidir exactamente con los encabezados de tu Excel en MINÚSCULAS
            let bodyData = {
                hoja1: {
                    nombre: nombreInput,
                    comentario: comentarioInput
                }
            };

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(bodyData)
            })
            .then(response => response.json())
            .then(json => {
                // Limpiar el formulario
                document.getElementById('formComentarios').reset();
                // Recargar la lista para ver el nuevo comentario
                cargarComentarios();
            })
            .catch(error => console.error('Error al enviar:', error));
        }

        // Cargar los comentarios apenas abra la página
        window.onload = cargarComentarios;
    </script>
</head>
<body>

    <h1>Caja de Comentarios RED 20 DE OCTUBRE </h1>

    <!-- Formulario para agregar comentarios -->
    <form id="formComentarios" onsubmit="enviarComentario(event)">
        <input type="text" id="txtNombre" placeholder="Tu nombre" required>
        <textarea id="txtComentario" placeholder="Escribe tu comentario aquí..." rows="4" required></textarea>
        <button type="submit">Publicar comentario</button>
    </form>

    <h2>Comentarios recientes</h2>
    <!-- Contenedor donde aparecerán los comentarios -->
    <div id="contenedor-comentarios">Cargando comentarios...</div>

</body>
</html>
