<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini r/place (50x50) con Sheety</title>
  <style>
    body { font-family: system-ui, sans-serif; background-color: #1a1a1b; color: #ffffff; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
    .controles { display: flex; gap: 15px; align-items: center; background: #272729; padding: 12px 20px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    #canvas-container { border: 2px solid #444; background: #ffffff; cursor: crosshair; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    canvas { display: block; image-rendering: pixelated; }
    button { background: #ff4500; color: white; border: none; padding: 8px 14px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    button:hover { background: #e03d00; }
    #estado { font-size: 0.9rem; color: #bbb; }
  </style>
</head>
<body>

  <h2>Nueva Bandera para la República de Colombia</h2>
  <div class="controles">
    <label>Color: <input type="color" id="colorPicker" value="#ff4500"></label>
    <button onclick="cargarTablero()">Actualizar</button>
    <span id="coords">X: 0, Y: 0</span>
    <span id="estado">Listo para pintar</span>
  </div>

  <div id="canvas-container">
    <canvas id="lienzo"></canvas>
  </div>

  <script>
    const SHEETY_URL = 'https://api.sheety.co/e747b19c10a06a356a61015e63a8ed11/entrega/pixels';
    const COOLDOWN_SEGUNDOS = 0;

    // --- CONFIGURACIÓN DE CUADRÍCULA 50x50 ---
    const COLUMNAS = 50; // Coordenadas X de 0 a 49
    const FILAS = 50;    // Coordenadas Y de 0 a 49
    const ESCALA = 20;   // 50 * 14 = 700x700 píxeles en pantalla (súbelo a 16 si quieres más grande)

    const canvas = document.getElementById('lienzo');
    const ctx = canvas.getContext('2d');
    const colorPicker = document.getElementById('colorPicker');
    const estadoTxt = document.getElementById('estado');
    const coordsTxt = document.getElementById('coords');

    canvas.width = COLUMNAS * ESCALA;
    canvas.height = FILAS * ESCALA;

    let mapaPixeles = {};

    // Dibuja un píxel con un borde sutil para mantener la cuadrícula visible
    function dibujarPixel(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x * ESCALA, y * ESCALA, ESCALA, ESCALA);
      ctx.strokeStyle = '#e5e5e5';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(x * ESCALA, y * ESCALA, ESCALA, ESCALA);
    }

    // Limpia el tablero y dibuja toda la cuadrícula vacía
    function limpiarTablero() {
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#e5e5e5';
      ctx.lineWidth = 0.5;
      for (let x = 0; x < COLUMNAS; x++) {
        for (let y = 0; y < FILAS; y++) {
          ctx.strokeRect(x * ESCALA, y * ESCALA, ESCALA, ESCALA);
        }
      }
    }

    limpiarTablero();

    async function cargarTablero() {
      estadoTxt.textContent = 'Cargando tablero...';
      try {
        const res = await fetch(SHEETY_URL);
        const data = await res.json();

        limpiarTablero();
        mapaPixeles = {};

        data.pixels.forEach(p => {
          // Solo dibujamos los píxeles que entren dentro del rango 0-49
          if (p.x >= 0 && p.x < COLUMNAS && p.y >= 0 && p.y < FILAS && p.color) {
            dibujarPixel(p.x, p.y, p.color);
            mapaPixeles[`${p.x},${p.y}`] = { id: p.id, color: p.color };
          }
        });

        actualizarMensajeCooldown();
      } catch (err) {
        console.error(err);
        estadoTxt.textContent = 'Error al conectar con Sheety.';
      }
    }

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = Math.min(COLUMNAS - 1, Math.max(0, Math.floor((e.clientX - rect.left) / ESCALA)));
      const y = Math.min(FILAS - 1, Math.max(0, Math.floor((e.clientY - rect.top) / ESCALA)));
      coordsTxt.textContent = `X: ${x}, Y: ${y}`;
    });

    canvas.addEventListener('click', async (e) => {
      const ultimoUso = localStorage.getItem('ultimoPixelTime');
      const ahora = Date.now();
      if (ultimoUso && (ahora - ultimoUso) < COOLDOWN_SEGUNDOS * 1000) {
        const faltan = Math.ceil((COOLDOWN_SEGUNDOS * 1000 - (ahora - ultimoUso)) / 1000);
        alert(`Espera ${faltan} segundos antes de poner otro píxel.`);
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const x = Math.min(COLUMNAS - 1, Math.max(0, Math.floor((e.clientX - rect.left) / ESCALA)));
      const y = Math.min(FILAS - 1, Math.max(0, Math.floor((e.clientY - rect.top) / ESCALA)));
      const color = colorPicker.value;

      dibujarPixel(x, y, color);
      estadoTxt.textContent = `Guardando (${x}, ${y})...`;

      localStorage.setItem('ultimoPixelTime', Date.now());

      const clave = `${x},${y}`;
      const existente = mapaPixeles[clave];

      try {
        if (existente) {
          await fetch(`${SHEETY_URL}/${existente.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pixel: { color: color } })
          });
        } else {
          const res = await fetch(SHEETY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pixel: { x: x, y: y, color: color } })
          });
          const nuevoDato = await res.json();
          mapaPixeles[clave] = { id: nuevoDato.pixel.id, color: color };
        }
        actualizarMensajeCooldown();
      } catch (err) {
        console.error(err);
        estadoTxt.textContent = 'Error al guardar.';
      }
    });

    function actualizarMensajeCooldown() {
      const ultimoUso = localStorage.getItem('ultimoPixelTime');
      if (!ultimoUso) {
        estadoTxt.textContent = '¡Listo para hacer patria!';
        return;
      }
      const restante = Math.ceil((COOLDOWN_SEGUNDOS * 1000 - (Date.now() - ultimoUso)) / 1000);
      if (restante > 0) {
        estadoTxt.textContent = `⏳ Espera ${restante}s para pintar de nuevo`;
      } else {
        estadoTxt.textContent = '¡Listo para hacer patria!';
      }
    }

    setInterval(actualizarMensajeCooldown, 1000);
    cargarTablero();
  </script>
</body>
</html>
